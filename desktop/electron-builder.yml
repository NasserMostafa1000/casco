appId: studio.casco.desktop
productName: Casco Studio
executableName: Casco
copyright: Casco Studio
directories:
  output: release
files:
  - dist-electron/**
  - dist-renderer/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Casco-Setup.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Casco Studio
  uninstallDisplayName: Casco Studio
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  artifactName: Casco.${ext}
  identity: null
dmg:
  title: Casco Studio
