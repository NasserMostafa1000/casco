<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكورسات | {{BRAND}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme { --color-primary: #895cdb; --color-primary-dark: #34187c; --color-accent: #b388ff; --font-sans: "Cairo", system-ui, sans-serif; }
</style>
</head>
<body data-page="courses" class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

<!-- SECTION: header -->
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
    <a href="index.html" class="text-xl font-extrabold text-primary-dark">🎓 {{BRAND}}</a>
    <nav class="hidden md:flex items-center gap-6 text-sm font-semibold">
      <a href="index.html" class="hover:text-primary">الرئيسية</a>
      <a href="courses.html" class="text-primary">الكورسات</a>
      <a href="my-courses.html" class="hover:text-primary">كورساتي</a>
    </nav>
    <div data-auth-nav class="hidden md:flex items-center gap-3 text-sm font-semibold"></div>
    <button data-menu-btn class="md:hidden p-2 rounded-lg hover:bg-slate-100" aria-label="القائمة" aria-expanded="false"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <div data-mobile-menu class="hidden md:hidden border-t border-slate-200 bg-white px-4 py-3 flex-col gap-3 font-semibold">
    <a href="index.html">الرئيسية</a><a href="courses.html">الكورسات</a><a href="my-courses.html">كورساتي</a>
    <div data-auth-nav class="flex flex-wrap items-center gap-3 pt-3 border-t border-slate-200 text-sm"></div>
  </div>
</header>

<main class="flex-1">
<!-- SECTION: page-title -->
<section class="bg-gradient-to-br from-primary-dark to-primary text-white">
  <div class="max-w-6xl mx-auto px-4 py-12">
    <h1 class="text-3xl md:text-4xl font-extrabold mb-2">جميع الكورسات</h1>
    <p class="text-white/85">ابحث عن الكورس المناسب لك وابدأ التعلم</p>
  </div>
</section>

<!-- SECTION: filters + results (filled by assets/app.js) -->
<section class="max-w-6xl mx-auto px-4 py-10">
  <div class="flex flex-col md:flex-row md:items-center gap-4 mb-6">
    <label for="search" class="sr-only">ابحث عن كورس</label>
    <div class="relative flex-1">
      <input id="search" type="search" placeholder="ابحث عن كورس، مدرب أو موضوع..." class="w-full bg-white border border-slate-200 rounded-xl pr-11 pl-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary">
      <svg class="w-5 h-5 absolute right-4 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3M11 18a7 7 0 100-14 7 7 0 000 14z"/></svg>
    </div>
    <span id="count" class="text-sm text-slate-500" aria-live="polite"></span>
  </div>
  <div id="chips" class="flex flex-wrap gap-2 mb-8" role="group" aria-label="التصنيفات"></div>
  <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</section>
</main>

<!-- SECTION: footer -->
<footer class="bg-primary-dark text-white/70 py-8">
  <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-3 text-sm">
    <span class="font-bold text-white">{{BRAND}}</span>
    <span>© {{YEAR}} {{BRAND}}. جميع الحقوق محفوظة.</span>
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
