<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أضف إعلان | {{BRAND}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme { --color-primary: #f97316; --color-primary-dark: #9a3412; --color-accent: #f59e0b; --font-sans: "Cairo", system-ui, sans-serif; }
</style>
</head>
<body data-page="post" class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

<!-- SECTION: header -->
<header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
    <a href="index.html" class="text-xl font-extrabold text-primary-dark">🛒 {{BRAND}}</a>
    <nav class="hidden md:flex items-center gap-6 text-sm font-semibold">
      <a href="index.html" class="hover:text-primary">الرئيسية</a>
      <a href="search.html" class="hover:text-primary">كل الإعلانات</a>
      <a href="my-ads.html" class="hover:text-primary">إعلاناتي</a>
    </nav>
    <div data-auth-nav class="hidden md:flex items-center gap-3 text-sm font-semibold"></div>
    <button data-menu-btn class="md:hidden p-2 rounded-lg hover:bg-slate-100" aria-label="القائمة" aria-expanded="false"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <div data-mobile-menu class="hidden md:hidden border-t border-slate-200 bg-white px-4 py-3 flex-col gap-3 font-semibold">
    <a href="index.html">الرئيسية</a><a href="search.html">كل الإعلانات</a><a href="my-ads.html">إعلاناتي</a>
    <div data-auth-nav class="flex flex-wrap items-center gap-3 pt-3 border-t border-slate-200 text-sm"></div>
  </div>
</header>

<!-- SECTION: post-form -->
<main class="flex-1 max-w-3xl w-full mx-auto px-4 py-10">
  <h1 class="text-3xl font-extrabold text-primary-dark mb-2">أضف إعلانك</h1>
  <p class="text-slate-500 mb-8">املأ التفاصيل التالية لنشر إعلانك والوصول إلى آلاف المشترين.</p>

  <div id="pendingMsg" hidden class="bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl p-4 mb-6 font-semibold">⏳ إعلانك قيد المراجعة، وسيظهر للجميع بعد الموافقة عليه.</div>

  <form id="postForm" class="bg-white rounded-2xl shadow-sm p-6 md:p-8 space-y-5">
    <div><label for="title" class="block text-sm font-semibold mb-1">عنوان الإعلان</label><input id="title" name="title" required maxlength="120" placeholder="مثال: تويوتا كامري 2020 بحالة ممتازة" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary"></div>
    <div><label for="description" class="block text-sm font-semibold mb-1">الوصف</label><textarea id="description" name="description" rows="5" required placeholder="اكتب تفاصيل المنتج وحالته..." class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary"></textarea></div>
    <div class="grid grid-cols-3 gap-3">
      <div class="col-span-2"><label for="price" class="block text-sm font-semibold mb-1">السعر</label><input id="price" name="price" type="number" min="0" step="any" placeholder="0" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-primary"></div>
      <div><label for="currency" class="block text-sm font-semibold mb-1">العملة</label><select id="currency" name="currency" data-fill="currencies" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-primary"></select></div>
    </div>
    <div class="grid sm:grid-cols-2 gap-3">
      <div><label for="category" class="block text-sm font-semibold mb-1">التصنيف</label><select id="category" name="category" data-fill="categories" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-primary"><option value="">اختر التصنيف</option></select></div>
      <div><label for="city" class="block text-sm font-semibold mb-1">المدينة</label><select id="city" name="city" data-fill="cities" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 bg-white focus:outline-none focus:ring-2 focus:ring-primary"><option value="">اختر المدينة</option></select></div>
    </div>
    <div class="grid sm:grid-cols-2 gap-3">
      <div><label for="phone" class="block text-sm font-semibold mb-1">رقم الهاتف</label><input id="phone" name="phone" type="tel" dir="ltr" placeholder="+971 50 000 0000" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-right focus:outline-none focus:ring-2 focus:ring-primary"></div>
      <div><label for="whatsapp" class="block text-sm font-semibold mb-1">رقم واتساب</label><input id="whatsapp" name="whatsapp" type="tel" dir="ltr" placeholder="+971 50 000 0000" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-right focus:outline-none focus:ring-2 focus:ring-primary"></div>
    </div>
    <div>
      <label for="images" class="block text-sm font-semibold mb-1">الصور (حتى 5 صور)</label>
      <label class="flex flex-col items-center justify-center gap-1 border-2 border-dashed border-slate-300 hover:border-primary rounded-2xl p-6 cursor-pointer text-slate-500">
        <span class="text-3xl">📷</span><span>اضغط لاختيار الصور</span>
        <input id="images" type="file" accept="image/*" multiple class="sr-only">
      </label>
      <div id="previews" class="grid grid-cols-3 sm:grid-cols-5 gap-3 mt-3"></div>
    </div>
    <button type="submit" class="w-full bg-primary hover:bg-primary-dark disabled:opacity-60 text-white font-bold py-3 rounded-xl">نشر الإعلان</button>
  </form>
</main>

<!-- SECTION: footer -->
<footer class="bg-slate-900 text-slate-400 py-8">
  <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-3 text-sm">
    <span class="font-bold text-white">{{BRAND}}</span>
    <span>© {{YEAR}} {{BRAND}}. جميع الحقوق محفوظة.</span>
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
